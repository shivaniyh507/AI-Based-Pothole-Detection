        <!-- Notification -->

        <div class="notification-wrapper">

            <button
                class="notification-btn"
                id="notificationBtn">

                <i class="fa-regular fa-bell"></i>

                <span
                    class="notification-count"
                    id="notificationCount">

                    3

                </span>

            </button>

            <!-- Notification Hover Popup -->

            <div
                class="notification-preview"
                id="notificationPreview">

                <div class="preview-header">

                    <h3>Notifications</h3>

                    <span
                        class="preview-count"
                        id="previewCount">

                        0

                    </span>

                </div>

                <div
                    class="preview-list"
                    id="previewList">

                </div>

                <button
                    class="view-all-btn"
                    id="viewAllNotifications">

                    View All Notifications

                </button>

            </div>
        
        </div>        

        <!-- Profile -->

        <div
            class="profile-dropdown"
            id="profileDropdown">

            <button
                class="profile-btn"
                id="profileBtn">

                <div
                    class="profile-avatar"
                    id="profileAvatar">

                    RT

                </div>

            </button>

            <!-- Dropdown -->
            <div class="profile-menu" id="dropdownMenu">
                <button class="dropdown-item" data-page="profile">
                    <i class="fa-regular fa-user"></i>
                    <span>My Profile</span>
                </button>

            <button class="dropdown-item" data-page="settings">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </button>

                <div class="dropdown-divider"></div>

                <button class="dropdown-item logout-item" id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </button>
            </div>
