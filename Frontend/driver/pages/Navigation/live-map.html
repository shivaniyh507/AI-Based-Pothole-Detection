<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Map | RoadSafe AI</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="../../assets/css/common.css">
<link rel="stylesheet" href="../../assets/css/navigation-maps.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --bg: #f1f5f9; --sidebar: #ffffff; --card: #ffffff; --text: #1e293b;
        --muted: #64748b; --line: #e2e8f0; --purple: #9333ea; --purple-light: #f3e8ff;
        --purple-gradient: linear-gradient(135deg, #a855f7, #7e22ce);
        --blue: #2563eb; --green: #22c55e; --yellow: #f59e0b; --red: #ef4444;
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.04); --radius: 18px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
    .app-shell { display: flex; height: 100vh; width: 100vw; }
    .sidebar { width: 270px; height: 100vh; position: sticky; top: 0; align-self: flex-start; overflow-y: auto; z-index: 100; background: var(--sidebar); color: var(--text); padding: 24px; display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0; border-right: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
    .brand-mark { width: 48px; height: 48px; border-radius: 14px; background: var(--purple-gradient); color: white; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .brand h1 { font-size: 20px; font-weight: 700; color: var(--purple); }
    .brand p { font-size: 12px; color: var(--muted); }
    .sidebar-nav { display: flex; flex-direction: column; gap: 6px; }
    .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 12px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.2s ease; }
    .nav-item:hover { background: #f8fafc; color: var(--purple); }
    .nav-item.active { background: var(--purple-light); color: var(--purple); font-weight: 600; }
    .nav-item.active i { color: var(--purple); }

    /* Screenshot-matched Header & Layout Styles */
    .main-wrapper { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; background: #f8fafc; }
    .admin-topbar { height: 76px; padding: 0 32px; background: #ffffff; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 90; flex-shrink: 0; }
    .topbar-page-title { font-size: 22px; font-weight: 700; color: var(--purple); margin: 0; }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .btn-topbar-action { background: var(--purple-gradient); color: #ffffff; border: none; padding: 10px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; box-shadow: 0 4px 14px rgba(147, 51, 234, 0.25); transition: all 0.2s ease; }
    .btn-topbar-action:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(147, 51, 234, 0.35); }
    .user-avatar-pill { width: 42px; height: 42px; border-radius: 50%; overflow: hidden; border: 2px solid var(--purple-light); display: flex; align-items: center; justify-content: center; }
    .user-avatar-pill img { width: 100%; height: 100%; object-fit: cover; }

    .page-body { padding: 28px 36px; display: flex; flex-direction: column; gap: 20px; }
    .map-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .search-box { flex: 1; background: #fff; display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid var(--line); }
    .search-box input { border: none; outline: none; width: 100%; font-size: 14px; background: transparent; }
    .map-wrapper { position: relative; width: 100%; height: 480px; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid var(--line); background: #fff; }
    #map { width: 100%; height: 100%; z-index: 1; }
    .map-filter-bar { position: absolute; top: 16px; left: 16px; z-index: 1000; display: flex; gap: 8px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); padding: 8px 14px; border-radius: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid var(--line); }
    .filter-chip { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--line); background: #fff; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--muted); }
    .filter-chip.active { background: var(--purple); color: #fff; border-color: var(--purple); }
    .btn-primary { background: var(--purple-gradient); color: white; border: none; padding: 12px 22px; border-radius: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14px; box-shadow: 0 4px 14px rgba(147, 51, 234, 0.25); }
    .btn-secondary { background: var(--purple-light); color: var(--purple); border: 1px solid #e9d5ff; padding: 12px 22px; border-radius: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14px; }
    .map-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .map-stat { background: #fff; padding: 18px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); text-align: center; border: 1px solid var(--line); }
    .map-stat h2 { font-size: 24px; font-weight: 700; margin-top: 4px; color: var(--text); }
    .map-stat p { font-size: 12px; color: var(--muted); }

    /* Navigation Header Bar */
    .map-nav-header { display: flex; align-items: center; justify-content: space-between; background: #ffffff; padding: 12px 20px; border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 4px 16px rgba(0,0,0,0.03); }
    .map-nav-links { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .map-nav-link { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 12px; font-size: 13px; font-weight: 500; color: var(--muted); text-decoration: none; transition: all 0.2s ease; }
    .map-nav-link:hover { background: #f8fafc; color: var(--purple); }
    .map-nav-link.active { background: var(--purple-gradient); color: #ffffff; font-weight: 600; box-shadow: 0 4px 12px rgba(147, 51, 234, 0.25); }
</style>

</head>

<body>

<div class="app-shell">

    <aside class="sidebar">
        <div>
            <div class="brand">
                <div class="brand-mark"><i class="fa-solid fa-road"></i></div>
                <div>
                    <h1>RoadSafe AI</h1>
                    <p>Navigation & Maps</p>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a class="nav-item" href="dashboard.html"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a>
                <a class="nav-item active" href="live-map.html"><i class="fa-solid fa-map-location-dot"></i><span>Map View</span></a>
                <a class="nav-item" href="route-planner.html"><i class="fa-solid fa-route"></i><span>Route Planner</span></a>
                <a class="nav-item" href="route-history.html"><i class="fa-solid fa-clock-rotate-left"></i><span>Route History</span></a>
                <a class="nav-item" href="pothole-detail.html"><i class="fa-solid fa-circle-info"></i><span>Pothole Details</span></a>
                <a class="nav-item" href="scan-road.html"><i class="fa-solid fa-camera"></i><span>Scan Road</span></a>
                <a class="nav-item" href="my-reports.html"><i class="fa-solid fa-file-lines"></i><span>My Reports</span></a>
            </nav>
        </div>

        <div class="sidebar-footer">
            <div class="profile-card" style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; background: #f8fafc; border: 1px solid var(--line); margin-bottom: 12px;">
                <div style="width: 38px; height: 38px; border-radius: 50%; background: var(--purple-light); color: var(--purple); display: flex; align-items: center; justify-content: center; font-size: 20px;">
                    <i class="fa-solid fa-circle-user"></i>
                </div>
                <div>
                    <strong style="color: var(--text); font-size: 13px; display: block;">shhio</strong>
                    <p style="font-size: 11px; color: var(--muted); margin: 0;">Driver</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content Outer Wrapper -->
    <main class="main-wrapper">
        <!-- Top Header matching screenshot -->
        <header class="admin-topbar">
            <h2 class="topbar-page-title">Interactive Map View</h2>
            <div class="topbar-right">
                <a href="route-planner.html" class="btn-topbar-action">
                    <i class="fa-solid fa-plus"></i> Open Route Planner
                </a>
                <div class="user-avatar-pill">
                    <img src="https://i.pravatar.cc/80?img=32" alt="User Avatar">
                </div>
            </div>
        </header>

        <!-- Page Body -->
        <div class="page-body">

            <!-- Search Toolbar -->
            <div class="map-toolbar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass" style="color: var(--muted);"></i>
                    <input type="text" id="mapSearchInput" placeholder="Search street, area or pothole ID (e.g. Swaroop Nagar)...">
                </div>

                <div style="display: flex; gap: 12px;">
                    <button id="locationBtn" class="btn-secondary" onclick="MapEngine.locateUser()">
                        <i class="fa-solid fa-location-crosshairs"></i> My Location
                    </button>
                    <a href="route-planner.html" class="btn-primary">
                        <i class="fa-solid fa-route"></i> Plan Safe Route
                    </a>
                </div>
            </div>

            <!-- Map Container -->
            <div class="map-wrapper">
                <div class="map-filter-bar">
                    <span style="font-size: 11px; font-weight: 700; color: #475569; text-transform: uppercase;">Filter:</span>
                    <button class="filter-chip active" onclick="setFilterChip(this, 'all')">All Risk Levels</button>
                    <button class="filter-chip" onclick="setFilterChip(this, 'high')"><i class="fa-solid fa-circle" style="font-size: 8px; color: #ef4444; margin-right: 4px;"></i> High Risk</button>
                    <button class="filter-chip" onclick="setFilterChip(this, 'medium')"><i class="fa-solid fa-circle" style="font-size: 8px; color: #f59e0b; margin-right: 4px;"></i> Medium</button>
                    <button class="filter-chip" onclick="setFilterChip(this, 'low')"><i class="fa-solid fa-circle" style="font-size: 8px; color: #22c55e; margin-right: 4px;"></i> Low Risk</button>
                </div>
                <div id="map"></div>
            </div>

            <!-- Stats Bar -->
            <div class="map-stats">
                <div class="map-stat">
                    <i class="fa-solid fa-road fa-2x" style="color: var(--purple);"></i>
                    <h2>5</h2>
                    <p>Potholes Mapped Nearby</p>
                </div>
                <div class="map-stat">
                    <i class="fa-solid fa-shield-halved fa-2x" style="color: #22c55e;"></i>
                    <h2>94%</h2>
                    <p>Overall Road Health</p>
                </div>
                <div class="map-stat">
                    <i class="fa-solid fa-car fa-2x" style="color: #2563eb;"></i>
                    <h2>3</h2>
                    <p>Available Safe Routes</p>
                </div>
                <div class="map-stat">
                    <i class="fa-solid fa-triangle-exclamation fa-2x" style="color: #ef4444;"></i>
                    <h2>2</h2>
                    <p>High Danger Zones</p>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../../assets/js/pothole-data.js"></script>
<script src="../../assets/js/map-engine.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        if (typeof MapEngine !== 'undefined') {
            MapEngine.init("map");
        }
    });

    function setFilterChip(btn, severity) {
        document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (typeof MapEngine !== 'undefined') {
            MapEngine.setFilter(severity);
        }
    }
</script>
</body>

</html>
