<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | RoadSafe AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../public/css/common.css">
<link rel="stylesheet" href="../../public/css/dashboard.css">
<link rel="stylesheet" href="../../public/css/sidebar.css">
<link rel="stylesheet" href="../../public/css/Topbar.css">
</head>
<body data-title="Dashboard" data-subtitle="Overview">

<svg style="display:none;">
  <defs>
    <symbol id="i-radio" viewBox="0 0 24 24"><path d="M4.93 19.07a10 10 0 0 1 0-14.14"/><path d="M7.76 16.24a6 6 0 0 1 0-8.49"/><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>
    <symbol id="i-car" viewBox="0 0 24 24"><path d="M5 17h14M5 17a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm14 0a2 2 0 1 0 4 0 2 2 0 0 0-4 0zM3 17V11l2-5h14l2 5v6"/><path d="M5 11h14"/></symbol>
    <symbol id="i-file-text" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></symbol>
  </defs>
</svg>

<div class="page-layout">

  <div id="sidebar-container"></div>

  <div class="main-content">

    <div id="topbar"></div>

    <div class="page-body">

      <div class="welcome-card">
        <div class="welcome-title">Welcome back 👋</div>
        <div class="welcome-sub">Here's what's happening with your account today.</div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon"><svg class="icon"><use href="#i-pin"/></svg></div>
          <div class="stat-num">—</div>
          <div class="stat-label">Reports Submitted</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><svg class="icon"><use href="#i-car"/></svg></div>
          <div class="stat-num">—</div>
          <div class="stat-label">Routes Taken</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><svg class="icon"><use href="#i-shield"/></svg></div>
          <div class="stat-num">—</div>
          <div class="stat-label">Safety Score</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><svg class="icon"><use href="#i-bell"/></svg></div>
          <div class="stat-num">2</div>
          <div class="stat-label">Unread Alerts</div>
        </div>
      </div>

      <div class="dash-cards-row">
        <div class="info-card">
          <div class="section-eyebrow">
            <span class="badge-icon"><svg class="icon"><use href="#i-activity"/></svg></span>
            <h3>Recent Activity</h3>
          </div>
          <div class="activity-item">
            <span class="activity-dot"></span>
            <div>
              <div class="activity-text">Your driver account was created</div>
              <div class="activity-time">Just now</div>
            </div>
          </div>
          <div class="activity-item">
            <span class="activity-dot"></span>
            <div>
              <div class="activity-text">Profile setup pending</div>
              <div class="activity-time">Just now</div>
            </div>
          </div>
        </div>

        <div class="info-card">
          <div class="section-eyebrow">
            <span class="badge-icon"><svg class="icon"><use href="#i-file-text"/></svg></span>
            <h3>Quick Actions</h3>
          </div>
          <a href="detection-log.html" class="quick-action-btn">
            <span class="quick-action-icon"><svg class="icon"><use href="#i-car"/></svg></span>
            <span class="quick-action-text">View detection log</span>
          </a>
          <a href="settings.html" class="quick-action-btn">
            <span class="quick-action-icon"><svg class="icon"><use href="#i-gear"/></svg></span>
            <span class="quick-action-text">Adjust settings</span>
          </a>
          <a href="notifications.html" class="quick-action-btn">
            <span class="quick-action-icon"><svg class="icon"><use href="#i-bell"/></svg></span>
            <span class="quick-action-text">View notifications</span>
          </a>
         
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../../public/js/dataService.js"></script>
<script>
fetch("../partials/sidebar.html")
.then(res => res.text())
.then(data => {
    document.getElementById("sidebar-container").innerHTML = data;
    if (typeof window.initSidebar === "function") window.initSidebar();
});

fetch("../partials/Topbar.html")
.then(res => res.text())
.then(data => {
    document.getElementById("topbar").innerHTML = data;
    if (typeof window.initTopbar === "function") window.initTopbar();
});
</script>

<script src="../../public/js/sidebar.js"></script>
<script src="../../public/js/Topbar.js"></script>
<script src="../../public/js/common.js"></script>
</body>
</html>
