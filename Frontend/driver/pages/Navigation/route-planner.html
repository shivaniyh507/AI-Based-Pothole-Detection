<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Route Planner | ROADIES</title>

    <!-- Leaflet & FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/navigation-maps.css">

    <!-- Embedded Theme Styles -->
    <style>
        :root {
            --bg: #f1f5f9; --sidebar: #ffffff; --card: #ffffff; --text: #1e293b;
            --muted: #64748b; --line: #e2e8f0; --purple: #9333ea; --purple-light: #f3e8ff;
            --purple-gradient: linear-gradient(135deg, #a855f7, #7e22ce);
            --blue: #2563eb; --green: #22c55e; --yellow: #f59e0b; --red: #ef4444;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.04); --radius: 18px;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; }
        .app-shell { display: flex; min-height: 100vh; }
        .sidebar { width: 270px; height: 100vh; position: sticky; top: 0; align-self: flex-start; overflow-y: auto; z-index: 100; background: var(--sidebar); color: var(--text); padding: 24px; display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0; border-right: 1px solid var(--line); }
        .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
        .brand-mark { width: 48px; height: 48px; border-radius: 14px; background: var(--purple-gradient); color: white; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .brand h1 { font-size: 20px; font-weight: 700; color: var(--purple); }
        .brand p { font-size: 12px; color: var(--muted); }
        .sidebar-nav { display: flex; flex-direction: column; gap: 6px; }
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 12px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.2s ease; }
        .nav-item:hover { background: #f8fafc; color: var(--purple); }
        .nav-item.active { background: var(--purple-light); color: var(--purple); font-weight: 600; }
        .nav-item.active i { color: var(--purple); }

        .main-wrapper { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; background: #f8fafc; }
        .admin-topbar { height: 76px; padding: 0 32px; background: #ffffff; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 90; flex-shrink: 0; }
        .topbar-page-title { font-size: 22px; font-weight: 700; color: var(--purple); margin: 0; }
        .topbar-right { display: flex; align-items: center; gap: 16px; }
        .btn-topbar-action { background: var(--purple-gradient); color: #ffffff; border: none; padding: 10px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; box-shadow: 0 4px 14px rgba(147, 51, 234, 0.25); transition: all 0.2s ease; }
        .btn-topbar-action:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(147, 51, 234, 0.35); }
        .user-avatar-pill { width: 42px; height: 42px; border-radius: 50%; overflow: hidden; border: 2px solid var(--purple-light); display: flex; align-items: center; justify-content: center; }
        .user-avatar-pill img { width: 100%; height: 100%; object-fit: cover; }

        .page-body { padding: 28px 36px; display: flex; flex-direction: column; gap: 24px; }
        .btn-primary { background: var(--purple-gradient); color: white; border: none; padding: 12px 22px; border-radius: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14px; box-shadow: 0 4px 14px rgba(147, 51, 234, 0.25); }
        .btn-secondary { background: var(--purple-light); color: var(--purple); border: 1px solid #e9d5ff; padding: 12px 22px; border-radius: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14px; }
        .detail-card { background: #fff; border-radius: 20px; padding: 26px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid var(--line); }
        .route-cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 10px; }
        .route-select-card { background: #fff; padding: 20px; border-radius: 16px; border: 2px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,0.04); cursor: pointer; transition: all 0.25s ease; position: relative; }
        .route-select-card.active { border-color: var(--purple); background: linear-gradient(180deg, #f3e8ff 0%, #ffffff 100%); }
        .route-tag { position: absolute; top: 14px; right: 14px; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; }
        .tag-safest { background: #dcfce7; color: #15803d; }
        .tag-balanced { background: #fef3c7; color: #b45309; }
        .tag-fastest { background: #dbeafe; color: #1e40af; }
        .route-card-title { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
        .route-card-stats { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 12px; }
        .detail-grid { display: grid; grid-template-columns: 1fr 380px; gap: 24px; }
        .map-wrapper { position: relative; width: 100%; height: 480px; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid var(--line); background: #fff; }
        #map { width: 100%; height: 100%; z-index: 1; }
        .directions-panel { background: #fff; border-radius: 20px; padding: 26px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid var(--line); }
        .direction-step { display: flex; align-items: flex-start; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
        .direction-step:last-child { border-bottom: none; }
        .step-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--purple-light); color: var(--purple); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .step-icon.warning { background: #fee2e2; color: var(--red); }
    </style>
</head>
<body>

<div class="app-shell">

    <!-- Universal Sidebar Navigation -->
    <aside class="sidebar">
        <div>
            <div class="brand">
                <div class="brand-mark"><i class="fa-solid fa-road"></i></div>
                <div>
                    <h1>ROADIES</h1>
                    <p>Navigation & Maps</p>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a class="nav-item" href="../dashboard.html"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a>
                <a class="nav-item" href="live-map.html"><i class="fa-solid fa-compass"></i><span>Map View</span></a>
                <a class="nav-item active" href="route-planner.html"><i class="fa-solid fa-route"></i><span>Route Planner</span></a>
                <a class="nav-item" href="route-history.html"><i class="fa-solid fa-clock-rotate-left"></i><span>Route History</span></a>
                <a class="nav-item" href="../scan-road.html"><i class="fa-solid fa-camera"></i><span>Scan Road</span></a>
                <a class="nav-item" href="../my-reports.html"><i class="fa-solid fa-file-lines"></i><span>My Reports</span></a>
            </nav>
        </div>

        <div class="sidebar-footer">
            <div class="status-card" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; background: #f8fafc; color: var(--text); font-size: 12px; border: 1px solid var(--line);">
                <span style="width: 10px; height: 10px; border-radius: 50%; background: #22c55e;"></span>
                <div>
                    <strong>GPS Active</strong>
                    <p>Hazard Zone Mapping</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content Outer Wrapper -->
    <main class="main-wrapper">
        <header class="admin-topbar">
            <h2 class="topbar-page-title">AI Route Planner & Navigation</h2>
            <div class="topbar-right">
                <button id="calcRouteBtnHeader" onclick="document.getElementById('calcRouteBtn').click()" class="btn-topbar-action">
                    <i class="fa-solid fa-plus"></i> Calculate Safe Route
                </button>
                <div class="user-avatar-pill">
                    <img src="https://i.pravatar.cc/80?img=32" alt="User Avatar">
                </div>
            </div>
        </header>

        <!-- Page Body Content -->
        <div class="page-body">

            <div id="navBanner" style="display: none; margin-bottom: 24px;"></div>

            <!-- Route Inputs Card -->
            <div class="detail-card">
                <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 260px;">
                        <label style="font-size: 11px; font-weight: 700; color: #64748b; display: block; margin-bottom: 6px;">START LOCATION</label>
                        <div style="display: flex; align-items: center; gap: 10px; background: #f8fafc; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line);">
                            <i class="fa-solid fa-location-dot" style="color: var(--purple);"></i>
                            <input type="text" id="originInput" value="Panki" style="border:none; background:transparent; outline:none; width:100%; font-weight: 500;">
                        </div>
                    </div>

                    <button id="swapLocationsBtn" class="btn-secondary" style="margin-top: 20px; border-radius: 50%; width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center;" title="Swap Locations">
                        <i class="fa-solid fa-right-left"></i>
                    </button>

                    <div style="flex: 1; min-width: 260px;">
                        <label style="font-size: 11px; font-weight: 700; color: #64748b; display: block; margin-bottom: 6px;">DESTINATION</label>
                        <div style="display: flex; align-items: center; gap: 10px; background: #f8fafc; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line);">
                            <i class="fa-solid fa-flag-checkered" style="color: #ef4444;"></i>
                            <input type="text" id="destInput" value="IIT Kanpur Campus" style="border:none; background:transparent; outline:none; width:100%; font-weight: 500;">
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px; margin-top: 20px;">
                        <button id="calcRouteBtn" class="btn-secondary" style="padding: 14px 22px;">
                            <i class="fa-solid fa-calculator"></i> Calculate Route
                        </button>
                        <button id="startNavBtn" class="btn-primary" style="padding: 14px 28px;">
                            <i class="fa-solid fa-paper-plane"></i> Start Live Navigation
                        </button>
                    </div>
                </div>
            </div>

            <h3 style="font-size: 18px; font-weight: 700;">Select AI Recommended Route</h3>
            <div id="routeOptionsContainer" class="route-cards-grid"></div>

            <!-- Grid Layout: Map & Directions Panel -->
            <div class="detail-grid">
                <div class="map-wrapper">
                    <div id="map"></div>
                </div>

                <div class="directions-panel">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                        <h3 style="font-size: 16px; font-weight: 700;"><i class="fa-solid fa-diamond-turn-right" style="color: var(--purple);"></i> Directions</h3>
                        <span style="font-size: 12px; color: #64748b;">Step-by-step</span>
                    </div>

                    <div style="background: #f8fafc; padding: 12px; border-radius: 12px; margin-bottom: 16px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; font-size: 12px; border: 1px solid var(--line);">
                        <div><span style="color:#64748b;">Distance:</span> <strong id="summaryDistance">11.3 km</strong></div>
                        <div><span style="color:#64748b;">Est Time:</span> <strong id="summaryTime">24 mins</strong></div>
                        <div><span style="color:#64748b;">Potholes:</span> <strong id="summaryPotholes" style="color:#22c55e;">0 detected</strong></div>
                        <div><span style="color:#64748b;">Safety Score:</span> <strong id="summaryScore" style="color:var(--purple);">98/100</strong></div>
                    </div>

                    <div id="directionsList" style="max-height: 320px; overflow-y: auto; padding-right: 6px;"></div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- JS Dependencies -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../../assets/js/pothole-data.js"></script>
<script src="../../assets/js/map-engine.js"></script>
<script src="../../assets/js/route-planner.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        if (typeof MapEngine !== 'undefined') MapEngine.init("map");
        if (typeof RoutePlanner !== 'undefined') RoutePlanner.init();
    });
</script>

</body>
</html>
