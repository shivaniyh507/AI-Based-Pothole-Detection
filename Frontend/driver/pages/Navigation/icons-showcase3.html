<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icons Showcase | RoadSafe AI</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/navigation-maps.css">

    <style>
        :root {
            --bg: #f1f5f9; --sidebar: #ffffff; --card: #ffffff; --text: #1e293b;
            --muted: #64748b; --line: #e2e8f0; --purple: #9333ea; --purple-light: #f3e8ff;
            --purple-gradient: linear-gradient(135deg, #a855f7, #7e22ce);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 32px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { margin-bottom: 28px; }
        .header h1 { font-size: 26px; font-weight: 700; color: var(--purple); }
        .header p { font-size: 14px; color: var(--muted); }
        .icons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-bottom: 32px; }
        .icon-card { background: #fff; padding: 20px; border-radius: 16px; border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; align-items: center; gap: 16px; transition: transform 0.2s ease; }
        .icon-card:hover { transform: translateY(-3px); border-color: var(--purple); }
        .icon-box { width: 46px; height: 46px; border-radius: 12px; background: var(--purple-light); color: var(--purple); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .icon-info strong { font-size: 14px; font-weight: 600; display: block; }
        .icon-info code { font-size: 11px; color: var(--muted); background: #f8fafc; padding: 2px 6px; border-radius: 6px; display: inline-block; margin-top: 4px; border: 1px solid var(--line); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>RoadSafe AI - Application Icons Registry</h1>
        <p>Comprehensive catalog of all FontAwesome icons used across Member 3 (Navigation & Maps) pages</p>
    </div>

    <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 14px; color: var(--purple);">1. Sidebar & Navigation Icons</h3>
    <div id="navGrid" class="icons-grid"></div>

    <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 14px; color: var(--purple);">2. Route Planner & Directions Icons</h3>
    <div id="routeGrid" class="icons-grid"></div>

    <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 14px; color: var(--purple);">3. Map View & Interactive Tools Icons</h3>
    <div id="mapGrid" class="icons-grid"></div>
</div>

<script src="../../assets/images/icons/icons-dictionary.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        if (typeof AppIcons === 'undefined') return;

        const navKeys = ['brand', 'dashboard', 'mapView', 'routePlanner', 'routeHistory', 'potholeDetails', 'scanRoad', 'myReports', 'logout'];
        const routeKeys = ['startLocation', 'destination', 'swap', 'calculate', 'startNav', 'endNav', 'navArrow', 'safetyShield', 'potholeWarning', 'goStraight', 'turnRight', 'turnLeft', 'directionsHeader'];
        const mapKeys = ['search', 'myLocation', 'driverCar', 'hazardAssessment', 'recenter', 'upvote', 'confirmed', 'back', 'close'];

        const renderCategory = (containerId, keys) => {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = keys.map(key => {
                const item = AppIcons[key];
                if (!item) return '';
                return `
                    <div class="icon-card">
                        <div class="icon-box"><i class="${item.class}"></i></div>
                        <div class="icon-info">
                            <strong>${item.label}</strong>
                            <code>${item.class}</code>
                        </div>
                    </div>
                `;
            }).join('');
        };

        renderCategory('navGrid', navKeys);
        renderCategory('routeGrid', routeKeys);
        renderCategory('mapGrid', mapKeys);
    });
</script>
</body>
</html>
